# Optional local QA entry explicitly allowed for this installation.
# No public listener, proxy, application API, uploads or service-worker route.
server {
    listen 127.0.0.1:47836;
    server_name localhost;
    location ^~ /review/chat-v4/ {
        limit_except GET { deny all; }
        alias /srv/cockpit-review/chat-v4/current/;
        index index.html;
        try_files $uri $uri/ =404;
        include /etc/nginx/snippets/cockpit-review-headers.inc;
    }
    location / { return 404; }
}
