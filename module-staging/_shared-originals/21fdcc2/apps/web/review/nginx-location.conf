# Include inside the existing cockpit.rbym47.com server.
# The public entry keeps the exact existing Passkey auth_request boundary.
location ^~ /review/chat-v4/ {
    auth_request /_gate/check;
    error_page 401 = /_gate/redirect;
    limit_except GET { deny all; }
    alias /srv/cockpit-review/chat-v4/current/;
    index index.html;
    try_files $uri $uri/ =404;
    include /etc/nginx/snippets/cockpit-review-headers.inc;
}
