server {
    listen 127.0.0.1:8080;
    server_name cockpit.rbym47.com;

    include /etc/nginx/snippets/security-headers.inc;
    include /etc/nginx/snippets/passkey-gate-endpoints.inc;

    client_max_body_size 25m;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/wasm;

    location / {
        auth_request /_gate/check;
        error_page 401 = /_gate/redirect;
        auth_request_set $gate_upstream_cookie $upstream_http_x_pg_upstream_cookie;

        proxy_pass http://127.0.0.1:8771;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $gate_upstream_cookie;

        # Deliver SSE events immediately and preserve idle chat connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
