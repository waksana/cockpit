<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Cockpit core and module extension paths</title>
  <desc id="desc">A module package supplies frontend ESM and CSS to the browser and backend JavaScript to the Cockpit server. The frontend extends state, components and rendering. The backend contributes routes, event observers and its own data. Cockpit talks to native Copilot through the SDK; native sessions and history remain in Copilot.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M1 1L7 4L1 7" fill="none" stroke="#657b83" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1040" height="560" rx="16" fill="#fdf6e3"/>
  <g font-family="system-ui, -apple-system, sans-serif" fill="#586e75">
    <text x="40" y="44" font-size="24" font-weight="600">Core + modules</text>
    <text x="1000" y="43" font-size="15" text-anchor="end">Local trusted packages / cold loading</text>
    <rect x="40" y="72" width="420" height="312" rx="12" fill="#eee8d5"/>
    <rect x="580" y="72" width="420" height="312" rx="12" fill="#eee8d5"/>
    <text x="64" y="108" font-size="20" font-weight="600">Browser</text>
    <text x="604" y="108" font-size="20" font-weight="600">Cockpit server</text>
    <rect x="64" y="128" width="372" height="88" rx="8" fill="#fdf6e3" stroke="#93a1a1"/>
    <text x="84" y="161" font-size="18" font-weight="600">Core Web UI</text>
    <text x="84" y="189" font-size="16">Chat / sessions / settings</text>
    <rect x="604" y="128" width="372" height="88" rx="8" fill="#fdf6e3" stroke="#93a1a1"/>
    <text x="624" y="161" font-size="18" font-weight="600">Core HTTP API + SSE</text>
    <text x="624" y="189" font-size="16">Native operations / lifecycle / SDK</text>
    <path d="M448 172H592" stroke="#657b83" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="520" y="155" font-size="14" text-anchor="middle">HTTP / SSE</text>
    <rect x="64" y="248" width="372" height="108" rx="8" fill="#fdf6e3" stroke="#2aa198" stroke-width="2"/>
    <text x="84" y="279" font-size="18" font-weight="600" fill="#007d75">Module frontend (Web API v2)</text>
    <text x="84" y="308" font-size="16">State / component middleware</text>
    <text x="84" y="334" font-size="16">Draft schemas / Markdown renderers</text>
    <rect x="604" y="248" width="372" height="108" rx="8" fill="#fdf6e3" stroke="#2aa198" stroke-width="2"/>
    <text x="624" y="279" font-size="18" font-weight="600" fill="#007d75">Module backend (API v1)</text>
    <text x="624" y="308" font-size="16">Routes / event observers</text>
    <text x="624" y="334" font-size="16">Module-owned config and data</text>
    <path d="M250 246V219" stroke="#657b83" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M790 246V219" stroke="#657b83" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M448 302H592" stroke="#657b83" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="520" y="285" font-size="14" text-anchor="middle">Module API</text>
    <text x="520" y="327" font-size="13" text-anchor="middle">Same host / port</text>
    <rect x="40" y="424" width="420" height="96" rx="12" fill="#fdf6e3" stroke="#2aa198" stroke-width="2"/>
    <text x="64" y="458" font-size="18" font-weight="600">One module.tgz</text>
    <text x="64" y="488" font-size="16">Manifest + backend JS + optional ESM / CSS</text>
    <path d="M250 422V387" stroke="#657b83" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M462 450H546V374H578" fill="none" stroke="#657b83" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="604" y="424" width="372" height="96" rx="12" fill="#fdf6e3" stroke="#93a1a1"/>
    <text x="624" y="458" font-size="18" font-weight="600">Native Copilot runtime</text>
    <text x="624" y="488" font-size="16">Sessions / history / execution / tools</text>
    <path d="M978 172H1024V400H790V422" fill="none" stroke="#657b83" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="984" y="393" font-size="13" text-anchor="end">SDK / stdio</text>
  </g>
</svg>
