name: Rolling
# This workflow path and run_number are the permanent per-repository sequence.
# Do not rename/delete/recreate it. Each merged PR gets its own uncancelled run.
on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

jobs:
  checks:
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/build.yml
    with:
      source_sha: ${{ github.event.pull_request.merge_commit_sha }}
      rolling_sequence: ${{ github.run_number }}
    permissions:
      contents: read

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cockpit-rolling-${{ github.run_number }}-${{ github.event.pull_request.merge_commit_sha }}
          path: release-artifact
      - name: Publish the verified merge as an immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: rolling
        run: node scripts/rolling-release.mjs
