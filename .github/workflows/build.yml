name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Required checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - name: Isolated native smoke
        env:
          COCKPIT_NATIVE_SMOKE: '1'
          COCKPIT_NATIVE_MODEL_SMOKE: '1'
          COCKPIT_NATIVE_STATE_SMOKE: '1'
          COCKPIT_NATIVE_ROLES: '1'
        run: >-
          pnpm --filter @cockpit/core exec node --import tsx --test
          src/runtime-smoke.test.ts src/model-settings-native.test.ts src/native-state-smoke.test.ts src/roles-native.test.ts
      - run: pnpm build
      - name: Isolated MCP graceful-shutdown smoke
        env:
          COCKPIT_NATIVE_FORK: '1'
        run: pnpm --filter @cockpit/mcp exec node --import tsx --test src/fork-native.test.ts
      - name: Package the checked-out commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: node scripts/package-runtime.mjs --source-sha "$SOURCE_SHA" --output runtime-output
      - name: Verify runtime archive
        run: COCKPIT_RUNTIME_ARCHIVE="$PWD/runtime-output/runtime.tar.gz" node --test scripts/package-runtime.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cockpit-runtime-${{ github.sha }}-linux-x64
          path: |
            runtime-output/runtime.tar.gz
            runtime-output/runtime.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
