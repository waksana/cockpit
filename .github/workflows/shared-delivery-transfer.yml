name: Shared verified delivery transfer
on:
  workflow_call:
    inputs:
      run_id:
        required: true
        type: string
    secrets:
      DEPLOY_KEY:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Transfer successful bound artifact without executing project source
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          key="$RUNNER_TEMP/key"
          known="$RUNNER_TEMP/known-hosts"
          zip="$RUNNER_TEMP/artifact.zip"
          trap 'rm -f "$key" "$known" "$zip"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$known"
          run=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID")
          title=$(printf '%s' "$run" | jq -er 'select(.path==".github/workflows/delivery-ci.yml" and .event=="workflow_dispatch" and .conclusion=="success") | .display_title')
          [[ "$title" =~ ^delivery:([a-zA-Z0-9._-]{8,120}):([a-f0-9]{40})$ ]]
          request="${BASH_REMATCH[1]}"
          artifact=$(gh api "repos/$REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq ".artifacts[] | select(.name == \"runtime-$request\" and .expired == false) | .id")
          [[ "$artifact" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$REPOSITORY/actions/artifacts/$artifact/zip" > "$zip"
          ssh -i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 "$DEPLOY_USER@$DEPLOY_HOST" "receive $request $RUN_ID $artifact" < "$zip"
