<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/vnd.microsoft.icon" sizes="16x16 32x32" href="/favicon-refined-r4.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <title>Cockpit</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: var(--background, white); color: var(--foreground, #171717); }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; background: var(--background, #0a0a0a); color: var(--foreground, #fafafa); }
      }
      body { margin: 0; }
      #boot { min-height: 100dvh; display: grid; place-content: center; gap: 1rem; padding: 1.5rem; box-sizing: border-box; }
      #boot p { margin: 0; }
      #boot a { color: inherit; text-underline-offset: 0.2em; }
    </style>
  </head>
  <body>
    <div id="root">
      <main id="boot" aria-label="Cockpit">
        <p role="status">正在载入新界面…</p>
        <a href="/">打开经典界面</a>
      </main>
    </div>
    <script type="module" src="/src/next/main.tsx"></script>
  </body>
</html>
